name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: DemonGacha-in-GD
          path: ${{ steps.build.outputs.build-output }}

      - name: Publicar release con el .geode
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: DemonGacha in GD v1.0.0
          body: "Descarga el archivo .geode y ponlo en Geometry Dash/geode/mods/"
          files: ${{ steps.build.outputs.build-output }}/*.geode
